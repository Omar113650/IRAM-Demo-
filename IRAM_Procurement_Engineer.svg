<svg id="diagramSvg" width="1440" height="980" viewBox="0 0 1440 980" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, 'Cairo', sans-serif">
  <defs>
    <!-- Arrowhead for <<include>> and <<extend>> -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- White Canvas Background -->
  <rect width="1440" height="980" fill="#ffffff" />

  <!-- ================= SYSTEM BOUNDARY ================= -->
  <rect x="250" y="30" width="830" height="920" rx="18" fill="#f8fafc" stroke="#0284c7" stroke-width="2.5" />
  
  <!-- Platform Header -->
  <text x="665" y="66" text-anchor="middle" font-size="22" font-weight="900" fill="#0f172a" letter-spacing="0.5">IRAM Platform</text>
  <text x="665" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">Procurement Engineer Use Case Diagram (Audited Architecture)</text>


  <!-- ================= GROUP 1: Requests & Material Catalog (Blue) ================= -->
  <rect x="270" y="110" width="790" height="195" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.8" />
  <text x="290" y="132" font-size="13" font-weight="800" fill="#0369a1">1. Procurement Requests &amp; Materials Catalog</text>

  <!-- Main UC (Left): View Procurement Dashboard -->
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="175" rx="115" ry="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
    <text x="430" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">View Procurement Dashboard</text>
  </g>

  <!-- Main UC (Left): View and Manage Procurement Requests -->
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="255" rx="125" ry="25" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
    <text x="430" y="260" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">View &amp; Manage Procurement Requests</text>
  </g>

  <!-- Sub UC (Right): View Materials Catalog (Included in Request Review) -->
  <g filter="url(#shadow)">
    <ellipse cx="830" cy="255" rx="120" ry="24" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
    <text x="830" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">View Materials Catalog</text>
  </g>

  <!-- Include Arrow: View Requests -> Materials Catalog -->
  <line x1="555" y1="255" x2="710" y2="255" stroke="#334155" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="632" y="247" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">&lt;&lt;include&gt;&gt;</text>


  <!-- ================= GROUP 2: Sourcing & RFQ Management (Green) ================= -->
  <rect x="270" y="315" width="790" height="205" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.8" />
  <text x="290" y="337" font-size="13" font-weight="800" fill="#15803d">2. Sourcing &amp; RFQ Management</text>

  <!-- Main UC (Left): Create and Send RFQs -->
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="380" rx="115" ry="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="430" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Create and Send RFQs</text>
  </g>

  <!-- Main UC (Left): Identify and Select Suppliers -->
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="465" rx="120" ry="25" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="430" y="470" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Identify and Select Suppliers</text>
  </g>

  <!-- Sub UC (Right): View Procurement Request Details (Include) -->
  <g filter="url(#shadow)">
    <ellipse cx="830" cy="380" rx="130" ry="23" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
    <text x="830" y="385" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">View Procurement Request Details</text>
  </g>

  <!-- Include Arrow: Create RFQs -> Request Details (Mandatory Rule #1) -->
  <line x1="545" y1="380" x2="700" y2="380" stroke="#334155" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="622" y="372" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">&lt;&lt;include&gt;&gt;</text>

  <!-- Sub UC (Right): View AI Supplier Recommendations (Extend - AI Purple) -->
  <g filter="url(#shadow)">
    <ellipse cx="830" cy="465" rx="135" ry="24" fill="#e8e0f3" stroke="#7a6a99" stroke-width="2"/>
    <text x="830" y="470" text-anchor="middle" font-size="11.5" font-weight="800" fill="#4a154b">View AI Supplier Recommendations</text>
  </g>

  <!-- Extend Arrow: AI Recommendations -> Identify Suppliers -->
  <line x1="695" y1="465" x2="550" y2="465" stroke="#334155" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="622" y="457" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">&lt;&lt;extend&gt;&gt;</text>


  <!-- ================= GROUP 3: Quotation Evaluation & Comparison (Purple) ================= -->
  <rect x="270" y="530" width="790" height="185" rx="12" fill="#faf5ff" stroke="#c084fc" stroke-width="1.8" />
  <text x="290" y="552" font-size="13" font-weight="800" fill="#7e22ce">3. Quotation Evaluation &amp; Comparison</text>

  <!-- Main UC (Left): Compare Supplier Quotations -->
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="620" rx="120" ry="25" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text x="430" y="625" text-anchor="middle" font-size="12" font-weight="800" fill="#581c87">Compare Supplier Quotations</text>
  </g>

  <!-- Sub UC (Right): Evaluate Supplier Quotations (Include) -->
  <g filter="url(#shadow)">
    <ellipse cx="830" cy="620" rx="130" ry="24" fill="#ffffff" stroke="#9333ea" stroke-width="1.6"/>
    <text x="830" y="625" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Evaluate Supplier Quotations</text>
  </g>

  <!-- Include Arrow: Compare Quotations -> Evaluate Quotations (Mandatory Compliance Check) -->
  <line x1="550" y1="620" x2="700" y2="620" stroke="#334155" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="625" y="612" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">&lt;&lt;include&gt;&gt;</text>


  <!-- ================= GROUP 4: Purchase Orders & Workflow (Orange) ================= -->
  <rect x="270" y="725" width="790" height="210" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8" />
  <text x="290" y="747" font-size="13" font-weight="800" fill="#c2410c">4. Purchase Orders &amp; Fulfillment Governance</text>

  <!-- Main UC (Left): Create Purchase Orders -->
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="790" rx="115" ry="24" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
    <text x="430" y="795" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Create Purchase Orders</text>
  </g>

  <!-- Main UC (Left): View and Track Purchase Orders -->
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="875" rx="125" ry="24" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
    <text x="430" y="880" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">View &amp; Track Purchase Orders</text>
  </g>

  <!-- Sub UC (Right): View Selected Supplier Quotation (Include Rule #2) -->
  <g filter="url(#shadow)">
    <ellipse cx="830" cy="775" rx="135" ry="22" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
    <text x="830" y="780" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">View Selected Supplier Quotation</text>
  </g>

  <!-- Sub UC (Right): Submit Purchase Order for Approval (Extend) -->
  <g filter="url(#shadow)">
    <ellipse cx="830" cy="830" rx="135" ry="22" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
    <text x="830" y="835" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Submit PO for Approval</text>
  </g>

  <!-- Include Arrow: Create PO -> View Selected Quotation (Mandatory Rule #2) -->
  <line x1="545" y1="785" x2="695" y2="778" stroke="#334155" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="620" y="775" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">&lt;&lt;include&gt;&gt;</text>

  <!-- Extend Arrow: Submit for Approval points BACK to Create PO -->
  <line x1="695" y1="825" x2="545" y2="800" stroke="#334155" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="620" y="820" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">&lt;&lt;extend&gt;&gt;</text>


  <!-- ================= ACTOR: Procurement Engineer (Left) ================= -->
  <g id="actorStick">
    <circle cx="105" cy="490" r="16" fill="none" stroke="#0284c7" stroke-width="3"/>
    <line x1="105" y1="506" x2="105" y2="550" stroke="#0284c7" stroke-width="3"/>
    <line x1="80" y1="525" x2="130" y2="525" stroke="#0284c7" stroke-width="3"/>
    <line x1="105" y1="550" x2="85" y2="590" stroke="#0284c7" stroke-width="3"/>
    <line x1="105" y1="550" x2="125" y2="590" stroke="#0284c7" stroke-width="3"/>
    <text x="105" y="615" text-anchor="middle" font-size="14" font-weight="900" fill="#0f172a">Procurement Engineer</text>
  </g>

  <!-- CLEAN DIRECT ASSOCIATION LINES TO ALL 6 PRIMARY BASE UCs (Zero Line Crossings!) -->
  <!-- Group 1 -->
  <line x1="135" y1="495" x2="315" y2="175" stroke="#64748b" stroke-width="1.8"/>
  <line x1="135" y1="505" x2="305" y2="255" stroke="#64748b" stroke-width="1.8"/>

  <!-- Group 2 -->
  <line x1="135" y1="520" x2="315" y2="380" stroke="#64748b" stroke-width="1.8"/>
  <line x1="135" y1="530" x2="310" y2="465" stroke="#64748b" stroke-width="1.8"/>

  <!-- Group 3 -->
  <line x1="135" y1="545" x2="310" y2="620" stroke="#64748b" stroke-width="1.8"/>

  <!-- Group 4 -->
  <line x1="130" y1="560" x2="315" y2="790" stroke="#64748b" stroke-width="1.8"/>
  <line x1="130" y1="575" x2="305" y2="875" stroke="#64748b" stroke-width="1.8"/>


  <!-- ================= RIGHT PANEL: LEGEND ================= -->
  <rect x="1100" y="30" width="310" height="280" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <text x="1120" y="58" font-size="14" font-weight="900" fill="#0f172a">Legend (دليل العلاقات)</text>

  <circle cx="1135" cy="85" r="7" fill="none" stroke="#0284c7" stroke-width="2"/>
  <line x1="1135" y1="92" x2="1135" y2="108" stroke="#0284c7" stroke-width="2"/>
  <line x1="1125" y1="98" x2="1145" y2="98" stroke="#0284c7" stroke-width="2"/>
  <line x1="1135" y1="108" x2="1128" y2="118" stroke="#0284c7" stroke-width="2"/>
  <line x1="1135" y1="108" x2="1142" y2="118" stroke="#0284c7" stroke-width="2"/>
  <text x="1170" y="103" font-size="12" font-weight="700" fill="#334155">Actor (المستخدم/الدور)</text>

  <ellipse cx="1135" cy="140" rx="22" ry="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1170" y="144" font-size="12" font-weight="700" fill="#334155">Base Primary UC (وظيفة أساسية)</text>

  <ellipse cx="1135" cy="175" rx="22" ry="12" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1170" y="179" font-size="12" font-weight="700" fill="#334155">Included/Extended UC (فرعية)</text>

  <ellipse cx="1135" cy="210" rx="22" ry="12" fill="#e8e0f3" stroke="#7a6a99" stroke-width="1.8"/>
  <text x="1170" y="214" font-size="12" font-weight="700" fill="#334155">AI Assistant (ذكاء اصطناعي)</text>

  <line x1="1115" y1="245" x2="1155" y2="245" stroke="#334155" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="1170" y="249" font-size="12" font-weight="700" fill="#334155">&lt;&lt;include&gt;&gt; / &lt;&lt;extend&gt;&gt;</text>
</svg>
