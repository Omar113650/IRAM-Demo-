  <text id="svgSubtitle" x="665" y="90" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0284c7">Company Admin Use Case Diagram (Corporate Governance, Multi-Project &amp; Warehouse Control)</text>


  <!-- ================= GROUP 1: Company Profile, Settings & Workforce RBAC ================= -->
  <rect x="270" y="105" width="790" height="260" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.8" />
