  <text id="svgSubtitle" x="665" y="90" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0284c7">Project Manager Use Case Diagram (Full Merged Architecture + AI Assistant &amp; Waste Prediction)</text>


  <!-- ================= GROUP 1: Project Monitoring & Material Requirements (BOQ) ================= -->
  <rect x="270" y="105" width="790" height="185" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.8" />
