  <line x1="1115" y1="280" x2="1155" y2="280" stroke="#334155" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="1170" y="284" font-size="12" font-weight="700" fill="#334155">&lt;&lt;include&gt;&gt; / &lt;&lt;extend&gt;&gt;</text>
