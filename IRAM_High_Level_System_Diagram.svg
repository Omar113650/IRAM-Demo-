  </defs>

  <!-- White Canvas Background -->
  <rect width="1540" height="1060" fill="#ffffff" />

  <!-- Top Title & Subtitle inside Canvas -->
  <text x="770" y="38" text-anchor="middle" font-size="20" font-weight="900" fill="#0f172a" letter-spacing="0.3">IRAM — High-Level Use Case Diagram</text>
  <text x="770" y="58" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">
    Gray: use case  |  Purple: AI capability  |  Solid line: association  |  Dashed arrow: include / extend
  </text>

  <!-- ================= SYSTEM BOUNDARY ================= -->
