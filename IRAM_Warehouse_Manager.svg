<svg id="diagramSvg" width="1440" height="1020" viewBox="0 0 1440 1020" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, 'Cairo', sans-serif">
  <defs>
    <!-- Arrowhead for <<include>> and <<extend>> -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- White Canvas Background -->
  <rect width="1440" height="1020" fill="#ffffff" />

  <!-- ================= SYSTEM BOUNDARY ================= -->
  <rect x="250" y="30" width="830" height="960" rx="18" fill="#f8fafc" stroke="#0284c7" stroke-width="2.5" />
  
  <!-- Platform Header -->
  <text x="665" y="66" text-anchor="middle" font-size="22" font-weight="900" fill="#0f172a" letter-spacing="0.5">IRAM Platform</text>
  <text x="665" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">Warehouse Manager Use Case Diagram (Inventory &amp; Logistics Control)</text>


  <!-- ================= GROUP 1: Inbound Receiving & PO Verification (Blue) ================= -->
  <rect x="270" y="110" width="790" height="215" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.8" />
  <text x="290" y="132" font-size="13" font-weight="800" fill="#0369a1">1. Material Receiving &amp; PO Verification</text>

  <!-- Main UC (Left): View Expected Deliveries -->
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="175" rx="115" ry="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
    <text x="430" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">View Expected Deliveries</text>
  </g>

  <!-- Main UC (Left): Record Material Receiving -->
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="260" rx="120" ry="25" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="430" y="265" text-anchor="middle" font-size="12" font-weight="800" fill="#0369a1">Record Material Receiving</text>
  </g>

  <!-- Sub UC (Right): Verify Received Quantities Against POs (Include) -->
  <g filter="url(#shadow)">
    <ellipse cx="830" cy="235" rx="135" ry="22" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
    <text x="830" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Verify Received Quantities Against POs</text>
  </g>

  <!-- Sub UC (Right): Record Condition & Discrepancies (Extend - Conditional on Damage/Deficit) -->
  <g filter="url(#shadow)">
    <ellipse cx="830" cy="285" rx="135" ry="22" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
    <text x="830" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Record Receiving Discrepancies &amp; Damage</text>
  </g>

  <!-- Include Arrow: Record Receiving -> Verify Against PO -->
  <line x1="550" y1="250" x2="695" y2="240" stroke="#334155" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="622" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">&lt;&lt;include&gt;&gt;</text>

  <!-- Extend Arrow: Record Discrepancies points BACK to Record Receiving -->
  <line x1="695" y1="280" x2="550" y2="270" stroke="#334155" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="622" y="280" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">&lt;&lt;extend&gt;&gt;</text>


  <!-- ================= GROUP 2: Inventory Tracking & Stock Discrepancies (Green) ================= -->
  <rect x="270" y="335" width="790" height="185" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.8" />
  <text x="290" y="357" font-size="13" font-weight="800" fill="#15803d">2. Warehouse Inventory &amp; Physical Stock Control</text>

  <!-- Main UC (Left): View and Track Inventory Records -->
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="400" rx="125" ry="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="430" y="405" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">View &amp; Track Inventory Records</text>
  </g>

  <!-- Main UC (Left): Record Stock Discrepancies (Independent audit process per rules) -->
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="475" rx="125" ry="25" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="430" y="480" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Record Stock Discrepancies</text>
  </g>


  <!-- ================= GROUP 3: Project Material Issuance & Request Categorization (Purple) ================= -->
  <rect x="270" y="530" width="790" height="165" rx="12" fill="#faf5ff" stroke="#c084fc" stroke-width="1.8" />
  <text x="290" y="552" font-size="13" font-weight="800" fill="#7e22ce">3. Project Material Issuance &amp; Request Categorization</text>

  <!-- Main UC (Left): Record Material Issue to Projects -->
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="615" rx="130" ry="25" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text x="430" y="620" text-anchor="middle" font-size="12" font-weight="800" fill="#581c87">Record Material Issue to Projects</text>
  </g>

  <!-- Sub UC (Right): Categorize Material Requests (Include) -->
  <g filter="url(#shadow)">
    <ellipse cx="830" cy="615" rx="140" ry="25" fill="#ffffff" stroke="#9333ea" stroke-width="1.8"/>
    <text x="830" y="612" text-anchor="middle" font-size="11.5" font-weight="700" fill="#581c87">Categorize Material Requests</text>
    <text x="830" y="627" text-anchor="middle" font-size="9.5" font-weight="600" fill="#7e22ce">(By Discipline, Priority &amp; Zone)</text>
  </g>

  <!-- Include Arrow: Record Issue -> Categorize Requests -->
  <line x1="560" y1="615" x2="690" y2="615" stroke="#334155" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="625" y="608" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">&lt;&lt;include&gt;&gt;</text>


  <!-- ================= GROUP 4: Inter-Warehouse Transfers & Surplus Triggers (Orange) ================= -->
  <rect x="270" y="705" width="790" height="265" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8" />
  <text x="290" y="727" font-size="13" font-weight="800" fill="#c2410c">4. Inter-Warehouse Transfers &amp; Surplus Triggers</text>

  <!-- Main UC (Left 1 - NEW): Manage Inter-Warehouse Transfers -->
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="762" rx="135" ry="23" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="430" y="767" text-anchor="middle" font-size="11.5" font-weight="800" fill="#9a3412">Manage Inter-Warehouse Transfers</text>
  </g>

  <!-- Main UC (Left 2): View Incoming and Outgoing Transfers -->
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="817" rx="130" ry="22" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
    <text x="430" y="822" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">View Incoming &amp; Outgoing Transfers</text>
  </g>

  <!-- Main UC (Left 3): Confirm Transfer Dispatch (Source Warehouse Gate) -->
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="870" rx="125" ry="22" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
    <text x="430" y="875" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Confirm Transfer Dispatch</text>
  </g>

  <!-- Main UC (Left 4): Confirm Transfer Receipt (Destination Warehouse Gate) -->
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="922" rx="125" ry="22" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
    <text x="430" y="927" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Confirm Transfer Receipt</text>
  </g>

  <!-- Main UC (Right): Report Potential Surplus -->
  <g filter="url(#shadow)">
    <ellipse cx="830" cy="775" rx="120" ry="24" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
    <text x="830" y="780" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Report Potential Surplus</text>
  </g>

  <!-- Sub UC (Right): Generate Draft Transfer Proposal (System Auto Trigger) -->
  <g filter="url(#shadow)">
    <ellipse cx="830" cy="860" rx="140" ry="24" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="830" y="865" text-anchor="middle" font-size="11.5" font-weight="800" fill="#713f12">Generate Draft Transfer Proposal (System)</text>
  </g>

  <!-- Include Arrow: Report Surplus -> Generate Draft Proposal -->
  <line x1="830" y1="799" x2="830" y2="836" stroke="#334155" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="855" y="822" text-anchor="start" font-size="10" font-weight="700" fill="#334155">&lt;&lt;include&gt;&gt;</text>


  <!-- ================= ACTOR: Warehouse Manager (Left) ================= -->
  <g id="actorStickWM">
    <circle cx="105" cy="510" r="16" fill="none" stroke="#0284c7" stroke-width="3"/>
    <line x1="105" y1="526" x2="105" y2="570" stroke="#0284c7" stroke-width="3"/>
    <line x1="80" y1="545" x2="130" y2="545" stroke="#0284c7" stroke-width="3"/>
    <line x1="105" y1="570" x2="85" y2="610" stroke="#0284c7" stroke-width="3"/>
    <line x1="105" y1="570" x2="125" y2="610" stroke="#0284c7" stroke-width="3"/>
    <text x="105" y="635" text-anchor="middle" font-size="14" font-weight="900" fill="#0f172a">Warehouse Manager</text>
  </g>

  <!-- CLEAN DIRECT ASSOCIATION LINES TO PRIMARY UCs (Zero Crossings!) -->
  <!-- Group 1 -->
  <line x1="135" y1="515" x2="315" y2="175" stroke="#64748b" stroke-width="1.8"/>
  <line x1="135" y1="525" x2="310" y2="260" stroke="#64748b" stroke-width="1.8"/>

  <!-- Group 2 -->
  <line x1="135" y1="535" x2="305" y2="400" stroke="#64748b" stroke-width="1.8"/>
  <line x1="135" y1="545" x2="305" y2="475" stroke="#64748b" stroke-width="1.8"/>

  <!-- Group 3 -->
  <line x1="135" y1="560" x2="300" y2="615" stroke="#64748b" stroke-width="1.8"/>

  <!-- Group 4 -->
  <line x1="135" y1="575" x2="295" y2="762" stroke="#64748b" stroke-width="1.8"/>
  <line x1="130" y1="585" x2="300" y2="817" stroke="#64748b" stroke-width="1.8"/>
  <line x1="130" y1="595" x2="305" y2="870" stroke="#64748b" stroke-width="1.8"/>
  <line x1="130" y1="605" x2="305" y2="922" stroke="#64748b" stroke-width="1.8"/>


  <!-- ================= RIGHT PANEL: LEGEND ================= -->
  <rect x="1100" y="30" width="310" height="300" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <text x="1120" y="58" font-size="14" font-weight="900" fill="#0f172a">Legend (دليل الرسم)</text>

  <circle cx="1135" cy="85" r="7" fill="none" stroke="#0284c7" stroke-width="2"/>
  <line x1="1135" y1="92" x2="1135" y2="108" stroke="#0284c7" stroke-width="2"/>
  <line x1="1125" y1="98" x2="1145" y2="98" stroke="#0284c7" stroke-width="2"/>
  <line x1="1135" y1="108" x2="1128" y2="118" stroke="#0284c7" stroke-width="2"/>
  <line x1="1135" y1="108" x2="1142" y2="118" stroke="#0284c7" stroke-width="2"/>
  <text x="1170" y="103" font-size="12" font-weight="700" fill="#334155">Actor (مدير المخزن)</text>

  <ellipse cx="1135" cy="140" rx="22" ry="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1170" y="144" font-size="12" font-weight="700" fill="#334155">Base Primary UC (أساسي)</text>

  <ellipse cx="1135" cy="175" rx="22" ry="12" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1170" y="179" font-size="12" font-weight="700" fill="#334155">Included / Extended UC (فرعي)</text>

  <ellipse cx="1135" cy="210" rx="22" ry="12" fill="#fef08a" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="1170" y="214" font-size="12" font-weight="700" fill="#334155">System Action (اقتراح تلقائي)</text>

  <line x1="1115" y1="245" x2="1155" y2="245" stroke="#334155" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="1170" y="249" font-size="12" font-weight="700" fill="#334155">&lt;&lt;include&gt;&gt; / &lt;&lt;extend&gt;&gt;</text>
</svg>
